# AI Radio Content Categorization - Configuration File
# This file controls all aspects of the content categorization engine

app:
  name: "AI Radio Content Categorizer"
  version: "1.0.0"
  log_level: "INFO"
  data_dir: "~/.ai-radio-categorizer"
  cache_ttl: 86400  # 24 hours in seconds

# AI Provider Configuration
ai:
  default_provider: "openai"  # Options: openai, claude, gemini
  
  openai:
    model: "gpt-4-turbo-preview"
    max_tokens: 2000
    temperature: 0.3
  
  claude:
    model: "claude-3-sonnet-20240229"
    max_tokens: 2000
    temperature: 0.3
  
  gemini:
    model: "gemini-pro"
    max_tokens: 2000
    temperature: 0.3

# Content Extraction Settings
extraction:
  # Browser bookmark paths (Termux accessible locations)
  bookmarks:
    chrome: "/data/data/com.android.chrome/app_chrome/Default/Bookmarks"
    firefox: "/data/data/org.mozilla.firefox/files/places.sqlite"
    brave: "/data/data/com.brave.browser/app_chrome/Default/Bookmarks"
    # Fallback to external storage if internal not accessible
    external_chrome: "/storage/emulated/0/Android/data/com.android.chrome"
  
  # File scanning directories
  scan_dirs:
    - "/storage/emulated/0/Download"
    - "/storage/emulated/0/Documents"
    - "/storage/emulated/0/DCIM"
  
  # File types to process
  file_types:
    documents: [".pdf", ".txt", ".md", ".doc", ".docx"]
    media: [".mp3", ".mp4", ".wav", ".m4a"]
    images: [".jpg", ".jpeg", ".png", ".gif"]
  
  # URL fetching settings
  url_fetch:
    timeout: 30
    max_content_length: 500000  # 500KB
    user_agent: "Mozilla/5.0 (Linux; Android 13) AI-Radio-Categorizer/1.0"

# Radio Content Categories
categories:
  news:
    name: "News & Current Affairs"
    description: "Breaking news, politics, world events, technology updates"
    subcategories:
      - breaking_news
      - politics
      - technology
      - science
      - sports
      - entertainment_news
    keywords:
      - news
      - breaking
      - report
      - update
      - announcement
      - happening
      - today
      - latest
    priority_weight: 1.5
    radio_format: "news_bulletin"
  
  music:
    name: "Music Content"
    description: "Music reviews, new releases, artist features, playlists"
    subcategories:
      - album_reviews
      - new_releases
      - artist_features
      - playlists
      - music_history
    keywords:
      - music
      - song
      - album
      - artist
      - playlist
      - track
      - band
      - concert
    priority_weight: 1.2
    radio_format: "music_segment"
  
  talk_show:
    name: "Talk Show Content"
    description: "Interviews, discussions, debates, panel talks"
    subcategories:
      - interviews
      - discussions
      - debates
      - panels
      - podcasts
    keywords:
      - interview
      - discuss
      - conversation
      - talk
      - opinion
      - guest
      - host
    priority_weight: 1.3
    radio_format: "talk_segment"
  
  stories:
    name: "Stories & Narratives"
    description: "Fiction, non-fiction, historical stories, audio dramas"
    subcategories:
      - fiction
      - non_fiction
      - historical
      - biographical
      - audio_drama
    keywords:
      - story
      - tale
      - narrative
      - chapter
      - fiction
      - drama
      - character
    priority_weight: 1.0
    radio_format: "story_time"
  
  educational:
    name: "Educational Content"
    description: "Tutorials, explainers, documentaries, how-to guides"
    subcategories:
      - tutorials
      - explainers
      - documentaries
      - how_to
      - lectures
    keywords:
      - learn
      - how to
      - guide
      - explain
      - tutorial
      - education
      - course
      - lesson
    priority_weight: 1.1
    radio_format: "educational_segment"
  
  entertainment:
    name: "Entertainment"
    description: "Comedy, pop culture, movie reviews, celebrity news"
    subcategories:
      - comedy
      - pop_culture
      - movie_reviews
      - tv_shows
      - celebrity
    keywords:
      - funny
      - entertainment
      - celebrity
      - movie
      - show
      - review
      - comedy
    priority_weight: 0.9
    radio_format: "entertainment_segment"
  
  lifestyle:
    name: "Lifestyle & Wellness"
    description: "Health, fitness, food, travel, personal development"
    subcategories:
      - health
      - fitness
      - food
      - travel
      - personal_development
    keywords:
      - health
      - wellness
      - fitness
      - food
      - recipe
      - travel
      - lifestyle
    priority_weight: 0.8
    radio_format: "lifestyle_segment"

# Google Drive Configuration
google_drive:
  root_folder: "AI_Radio_Content"
  folder_structure:
    - "News"
    - "Music"
    - "TalkShow"
    - "Stories"
    - "Educational"
    - "Entertainment"
    - "Lifestyle"
    - "Uncategorized"
    - "Archive"
  
  upload_settings:
    chunk_size: 1048576  # 1MB chunks
    retry_count: 3
    retry_delay: 5

# Automation Settings
automation:
  schedule:
    enabled: true
    interval_hours: 6  # Run every 6 hours
    preferred_times:
      - "06:00"
      - "12:00"
      - "18:00"
      - "00:00"
  
  notifications:
    enabled: true
    on_start: true
    on_complete: true
    on_error: true
  
  limits:
    max_items_per_run: 100
    max_ai_calls_per_run: 50
    batch_size: 10

# Database Settings
database:
  path: "~/.ai-radio-categorizer/content.db"
  backup_enabled: true
  backup_interval_days: 7

# Logging Configuration
logging:
  file: "~/.ai-radio-categorizer/logs/app.log"
  max_size_mb: 10
  backup_count: 5
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
