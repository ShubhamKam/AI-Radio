name: Android CI - Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Validate Gradle wrapper
      run: ./gradlew --version
      
    - name: Clean build
      run: ./gradlew clean
      
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --info
      
    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace --info
      continue-on-error: true
      
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: warn
        
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release-unsigned.apk
        if-no-files-found: warn
        
    - name: Check if APKs exist
      id: check_apks
      run: |
        if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "debug_exists=true" >> $GITHUB_OUTPUT
        fi
        if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
          echo "release_exists=true" >> $GITHUB_OUTPUT
        fi
    
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.check_apks.outputs.debug_exists == 'true'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        body: |
          ## AI Agent Android App
          
          ### Features
          - Multi-model AI support (OpenAI GPT-4, Google Gemini, Local TensorFlow)
          - 7 built-in tools (app launcher, system info, calculator, etc.)
          - Material Design 3 UI
          - Secure API key storage
          
          ### Installation
          1. Download the APK file below
          2. Enable "Install from Unknown Sources" in Android settings
          3. Install the APK
          4. Configure your API keys in Settings
          
          ### Files
          - `app-debug.apk` - Debug build with logging
          - `app-release-unsigned.apk` - Release build (unsigned)
        files: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/release/app-release-unsigned.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
