name: Create Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace
      
    - name: Sign APK (if keystore available)
      if: env.KEYSTORE_FILE != ''
      run: |
        echo "Signing APK..."
        # Add signing logic here if you have a keystore
      env:
        KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        
    - name: Rename APK
      run: |
        VERSION="${{ github.event.inputs.version || github.ref_name }}"
        cp app/build/outputs/apk/release/app-release-unsigned.apk "AIAgent-${VERSION}.apk"
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event.inputs.version || github.ref_name }}
        name: AI Agent ${{ github.event.inputs.version || github.ref_name }}
        body: |
          ## 🤖 AI Agent for Android
          
          ### What's New
          - Complete AI agent implementation
          - Support for OpenAI GPT-4, Google Gemini Pro, and Local TensorFlow models
          - 7 powerful tools for device interaction
          - Beautiful Material Design 3 interface
          - Secure encrypted API key storage
          
          ### Tools Included
          - 📱 Launch Apps - Open any installed app by name
          - 📋 Get Installed Apps - List all apps on device
          - 🔋 Battery Status - Check battery level and charging state
          - 🌐 Network Info - View network connectivity details
          - 💾 Storage Info - Monitor storage usage
          - 🧮 Calculator - Perform mathematical calculations
          - ℹ️ System Info - Get device information
          
          ### Installation Instructions
          1. Download `AIAgent-${{ github.event.inputs.version || github.ref_name }}.apk`
          2. On your Android device, go to Settings → Security
          3. Enable "Install from Unknown Sources" or "Install Unknown Apps"
          4. Open the downloaded APK file
          5. Follow the installation prompts
          6. Launch the app and configure your API keys in Settings
          
          ### Configuration
          - **OpenAI**: Get API key from https://platform.openai.com/api-keys
          - **Google AI**: Get API key from https://makersuite.google.com/app/apikey
          - **Local Model**: No API key needed, runs on-device
          
          ### Requirements
          - Android 7.0 (API 24) or higher
          - Internet connection for cloud AI models
          - API keys for OpenAI and/or Google AI (optional)
          
          ### Support
          - Report issues: https://github.com/ShubhamKam/AI-Radio/issues
          - Documentation: See README.md in repository
        files: |
          AIAgent-${{ github.event.inputs.version || github.ref_name }}.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
